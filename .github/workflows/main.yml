name: SENTINEL Monitoring Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  monitoring-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/780100133442/locations/global/workloadIdentityPools/sentinel-github-actions/providers/sentinel-github
          service_account: sentinel-monitor@devmonitor-sentinel.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Show active identity
        run: |
          echo "=== ACTIVE ACCOUNT ==="
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - name: Read ATLAS Firestore Monitoring data
        run: |
          echo "=== SENTINEL -> ATLAS MONITORING TEST ==="

          END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          START_TIME=$(date -u -d "6 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          TOKEN=$(gcloud auth print-access-token)

          curl --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            --get \
            "https://monitoring.googleapis.com/v3/projects/kyujitukanri/timeSeries" \
            --data-urlencode 'filter=metric.type="firestore.googleapis.com/document/read_ops_count"' \
            --data-urlencode "interval.startTime=${START_TIME}" \
            --data-urlencode "interval.endTime=${END_TIME}" \
            --data-urlencode 'view=FULL'
