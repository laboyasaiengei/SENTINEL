name: SENTINEL Schedule V2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduled heartbeat
        run: |
          echo "SENTINEL Schedule V2 alive"
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
