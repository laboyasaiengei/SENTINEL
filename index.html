<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1318">
<title>SENTINEL</title>
<style>
:root{
  --bg:#0d1318; --panel:#141d24; --panel2:#18242c; --line:#293943;
  --ink:#edf4f7; --muted:#91a2ad; --accent:#5aa4c8; --ok:#69b88f;
  --warn:#e2ad58; --danger:#dc6b6b; --track:#24313a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100vh;padding-bottom:30px}
header{
  position:sticky;top:0;z-index:5;
  background:rgba(13,19,24,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{max-width:1180px;margin:auto;padding:20px 18px 12px}
.brand-row{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:31px;height:31px;border:1px solid #416679;border-radius:8px;
  display:grid;place-items:center;font-weight:900;font-size:18px;color:#9ed2eb;
  background:#10222c
}
h1{font-size:19px;letter-spacing:.08em;margin:0}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--muted);background:#10191f}
.pill.ok{color:#a4d9ba;border-color:#305b43}
main{max-width:1180px;margin:0 auto;padding:16px 18px}
.notice{
  background:#10202a;border:1px solid #24485d;border-radius:12px;padding:10px 12px;
  color:#b7d9e9;font-size:12px;line-height:1.55;margin-bottom:14px
}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.dev-toolbar{margin-top:24px;}
.segment{display:flex;background:#10181e;border:1px solid var(--line);border-radius:10px;padding:3px}
.segment button,.ghost{
  border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:7px;cursor:pointer;font-size:11px
}
.segment button.active{background:#20313b;color:#fff}
.ghost{border:1px solid var(--line);background:#111a20}
.section-title{font-size:13px;color:#b8c8d0;font-weight:700;letter-spacing:.04em;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel),#111a20);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:15px}.env{font-size:10px;color:var(--muted);margin-top:2px}
.status{font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.status.live{color:#9bd7b4;border-color:#2f6547;background:#102219}
.status.wait{color:#d7be8a;border-color:#665438;background:#241e14}
.status.empty{color:#93a3ad}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.metric{background:var(--panel2);border:1px solid #22313a;border-radius:10px;padding:9px}
.metric .label{font-size:9.5px;color:var(--muted);text-transform:uppercase}
.metric .value{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.metric .pct{font-size:9.5px;color:var(--muted);margin-top:2px}
.bar{height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:0;background:var(--ok);border-radius:99px}
.fill.warn{background:var(--warn)}.fill.danger{background:var(--danger)}
.chart-wrap{margin-top:12px;background:#10181e;border:1px solid #22313a;border-radius:10px;padding:9px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chart-title{font-size:10px;color:var(--muted)}
canvas{width:100%;height:96px;display:block}
.alerts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.alert{font-size:10.5px;border-radius:8px;padding:7px 9px;border:1px solid #3a4650;background:#151d22;color:#bac7ce}
.alert.warn{border-color:#65502f;color:#e3c68b;background:#241d13}
.alert.danger{border-color:#6c3939;color:#f0aaaa;background:#271515}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:9.5px;flex-wrap:wrap}
.empty-message{padding:28px 8px;text-align:center;color:var(--muted);font-size:12px}
.summary{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px
}
.summary .box{background:#111a20;border:1px solid var(--line);border-radius:12px;padding:11px}
.summary .k{font-size:9.5px;color:var(--muted)}
.summary .v{font-size:18px;font-weight:800;margin-top:3px}
footer{max-width:1180px;margin:20px auto 0;padding:0 18px;color:#6f808a;font-size:10px;line-height:1.5}
@media(max-width:760px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.metric .value{font-size:18px}}

:root{--chart-read:#5aa4c8;--chart-write:#d5a84b;--chart-delete:#d86d6d}
.metric .limit{margin-top:4px;font-size:10px;color:#71838d}
.chart-legend{display:flex;gap:10px;font-size:10px;font-weight:800}
.chart-legend span:before{content:"";display:inline-block;width:13px;height:2px;margin-right:4px;vertical-align:middle}
.lr{color:var(--chart-read)}.lr:before{background:var(--chart-read)}
.lw{color:var(--chart-write)}.lw:before{background:var(--chart-write)}
.ld{color:var(--chart-delete)}.ld:before{background:var(--chart-delete)}

.brand-logo{display:block;width:min(200px,100%);height:auto;object-fit:contain}
.brand-logo-wrap{display:flex;align-items:center;min-width:0;flex:1;padding-top:7px}
@media(max-width:180px){.brand-logo{width:100%}}
.chart-wrap canvas{height:190px}

/* SENTINEL startup transition: embrace iOS white launch screen, then fade into dashboard */
#sentinelSplash{
  position:fixed;inset:0;z-index:9999;background:#fff;
  display:flex;align-items:center;justify-content:center;
  opacity:1;visibility:visible;
  transition:background-color .72s cubic-bezier(.4,0,.2,1),opacity .58s ease .36s,visibility 0s linear .96s;
}
#sentinelSplash img{
  width:min(300px,68vw);height:auto;display:block;
  opacity:1;transform:scale(1);
  transition:opacity .58s ease .18s,transform .78s cubic-bezier(.22,.61,.36,1);
}
#sentinelSplash.depart{background:#0d1318;opacity:0;visibility:hidden;pointer-events:none}
#sentinelSplash.depart img{opacity:0;transform:scale(.985)}
body.sentinel-booting{overflow:hidden}
body.sentinel-booting > header,body.sentinel-booting > main,body.sentinel-booting > footer{opacity:0}
body > header,body > main,body > footer{transition:opacity .55s ease .34s}

.diag-nav{display:flex;gap:7px;margin-top:10px}.diag-nav button{border:1px solid var(--line);background:#111a20;color:var(--muted);padding:7px 11px;border-radius:8px;font-size:11px;cursor:pointer}.diag-nav button.active{background:#20313b;color:#fff;border-color:#416679}
.diag-panel{display:none}.diag-panel.active{display:block}.diag-table-wrap{overflow:auto;background:#10181e;border:1px solid var(--line);border-radius:12px}.diag-table{width:100%;border-collapse:collapse;min-width:820px;font-size:11px}.diag-table th,.diag-table td{padding:9px 10px;border-bottom:1px solid #22313a;text-align:left;vertical-align:top}.diag-table th{color:#91a2ad;font-size:9.5px;letter-spacing:.04em}.diag-badge{display:inline-block;padding:3px 6px;border-radius:999px;border:1px solid var(--line)}.diag-badge.err{color:#f0aaaa;border-color:#6c3939;background:#271515}.diag-badge.test{color:#9bd7b4;border-color:#2f6547;background:#102219}.diag-empty{padding:30px;text-align:center;color:var(--muted)}.diag-app-section{margin-top:14px}.diag-app-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 7px;padding:0 2px}.diag-app-title{font-size:13px;font-weight:800;color:#c9d7de}.diag-app-count{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 7px}.diag-app-empty{padding:18px;text-align:center;color:var(--muted);font-size:11px}
.diag-table th:nth-child(6),.diag-table td:nth-child(6){width:72px;padding-right:4px;white-space:nowrap}.diag-table th:nth-child(7),.diag-table td:nth-child(7){padding-left:4px}.diag-table th:nth-child(8),.diag-table td:nth-child(8){width:92px;text-align:center;white-space:nowrap}.diag-row-unconfirmed{background:#251516}.diag-row-unconfirmed:hover{background:#2d1819}.diag-row-confirmed{background:#112219}.diag-row-confirmed:hover{background:#14291e}.diag-confirm{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:10px;font-weight:700}.diag-confirm input{accent-color:var(--ok);width:15px;height:15px;cursor:pointer}.diag-confirm .state-unconfirmed{color:#ef9a9a}.diag-confirm .state-confirmed{color:#9bd7b4}.diag-pages{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 2px}.diag-pages button{border:1px solid var(--line);background:#111a20;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer}.diag-pages button.active{background:#20313b;color:#fff;border-color:#416679}.diag-pages button:disabled{opacity:.45;cursor:default}.diag-actions{display:flex;align-items:center;justify-content:center;gap:6px}.diag-delete{border:1px solid #7a3d3d;background:#291617;color:#f0aaaa;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer}.diag-delete:hover{background:#351a1c}.diag-delete:disabled{opacity:.5;cursor:default}.diag-app-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 10px}.diag-app-tabs button{border:1px solid var(--line);background:#111a20;color:var(--muted);padding:7px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}.diag-app-tabs button.active{background:#20313b;color:#fff;border-color:#416679}.diag-app-tabs .count{margin-left:5px;font-size:9px;opacity:.8}

.notification-control{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.notify-btn{border:1px solid #416679;background:#10222c;color:#bfe4f5;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:800;cursor:pointer}
.notify-btn.enabled{border-color:#305b43;background:#102219;color:#a4d9ba}
.notify-btn:disabled{opacity:.55;cursor:default}
.notify-state{font-size:9.5px;color:var(--muted)}

.diag-click{
  border:0;background:transparent;color:inherit;padding:0;margin:0;
  font:inherit;text-align:left;cursor:pointer;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px
}
.diag-click:hover{color:#d8edf7}
.diag-detail-row{display:none}
.diag-detail-row.open{display:table-row}
.diag-detail-cell{background:#0e171c!important;padding:12px 14px!important}
.diag-detail-box{
  display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;
  padding:10px;border:1px solid #2b3c46;border-radius:10px;background:#111b21
}
.diag-detail-box .k{color:#82949e;font-size:10px;font-weight:700}
.diag-detail-box .v{color:#d8e4ea;font-size:11px;word-break:break-word;white-space:pre-wrap}
.diag-detail-note{
  grid-column:1/-1;margin-top:4px;padding-top:8px;border-top:1px solid #263640;
  color:#9fb0b9;font-size:10px;line-height:1.55
}
@media(max-width:640px){
  .diag-detail-box{grid-template-columns:1fr}
  .diag-detail-note{grid-column:1}
}


@media(max-width:640px){
  .header-inner{padding:10px 10px 9px}

  }

/* v6 mobile header refinement */
.range-refresh{
  border-left:1px solid var(--line)!important;
  border-radius:0 7px 7px 0!important;
  min-width:38px;
  font-weight:800;
  color:#c7d8e0!important;
}
.rangeSeg .range-refresh:hover{background:#20313b}

.diag-detail-box,
.diag-detail-box .v,
.diag-detail-box .k,
.diag-detail-note{

}
.diag-detail-box .v{line-height:1.45}
.diag-detail-box .k{line-height:1.45}
.diag-detail-note{line-height:1.5}

@media(max-width:640px){
  .header-inner{padding:8px 10px 9px}
  .brand-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;

  }

/* v8 final mobile corrections */
@media(max-width:640px){
  /* iPhone / PWA safe area: keep the logo below the status bar / Dynamic Island area */

    padding:
      calc(env(safe-area-inset-top, 0px) + 12px)
      10px
      9px!important;
  }

  /* First row: full logo on the left, compact status/notification block on the right */

    display:grid!important;
    grid-template-columns:minmax(0,1fr) auto!important;
    gap:8px!important;
    align-items:start!important;
  }

    justify-content:flex-start!important;
    overflow:visible!important;
  }
  .brand-logo{
    display:block!important;
    width:min(176px,46vw)!important;
    max-width:100%!important;
    max-height:none!important;
    height:auto!important;
    object-fit:contain!important;
    object-position:left center!important;
  }

  .header-right{
    width:auto!important;
    min-width:0!important;

    margin-bottom:10px!important;
  }
  .segment.rangeSeg{
    display:grid!important;
    grid-template-columns:repeat(5,minmax(0,1fr)) 34px!important;
    width:100%!important;

  }
  .segment.rangeSeg button{
    min-width:0!important;

    padding:6px 2px!important;

  }
  .segment.rangeSeg .range-refresh{
    position:static!important;
    right:auto!important;

  /* Error details: same visual scale as the surrounding 11px error table. */

    gap:4px 8px!important;
    padding:8px!important;

  }

/* v9 header/navigation refinements */
@media(max-width:640px){
  .diag-nav{
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
    width:100%!important;
    gap:4px!important;
    margin-top:2px!important;
  }
  .diag-nav button{
    min-height:24px!important;
    height:24px!important;

function decodeVal(v){

function ptMinuteBucket(ts=Date.now()){

function incrementDecodedField(d,key,delta){d[key]=(+d[key]||0)+delta;}
async function recordSentinelSharedActivity(readCount){
  // SENTINEL自身のShared Firestore利用をDev-CAESARと同じ枠へ加算する。
  // この記録commit自身の1 writeも同じcommit内で+1するため、再帰的な自己記録は発生しない。
  const now=Date.now(),date=ptDateKey(now),bucket=ptMinuteBucket(now),appId="caesar-dev";

  add(`r1_${bucket}`,readCount); add(`w1_${bucket}`,1);
  add("reads",readCount); add("writes",1);
  transforms.push({fieldPath:"lastSeen",setToServerValue:"REQUEST_TIME"});
  const body={writes:[{
    update:{name:docName,fields:{
      appId:{stringValue:appId},datePT:{stringValue:date},
      telemetryVersion:{stringValue:telemetryVersion},sharedVersion:{stringValue:sharedVersion}
    }},
    updateMask:{fieldPaths:["appId","datePT","telemetryVersion","sharedVersion"]},
    updateTransforms:transforms

  const url=`https://firestore.googleapis.com/v1/projects/${SHARED_CONFIG.projectId}/databases/(default)/documents:commit`;
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),cache:"no-store"});
  if(!res.ok){const raw=await res.text();throw new Error(`SENTINEL activity write HTTP ${res.status}: ${raw.slice(0,300)}`)}

  let d=existing;

  incrementDecodedField(d,`r1_${bucket}`,readCount);
  incrementDecodedField(d,`w1_${bucket}`,1);
  incrementDecodedField(d,"reads",readCount);
  incrementDecodedField(d,"writes",1);
  d.lastSeen=new Date().toISOString();
}

async function fetchShared(){
  const headers=await sharedHeaders();
  const dates=ptDateKeysForRange(selectedRange);
  const url=`https://firestore.googleapis.com/v1/projects/${SHARED_CONFIG.projectId}/databases/(default)/documents:runQuery`;
  const body={structuredQuery:{
    from:[{collectionId:SHARED_COLLECTION}],
    where:dates.length===1
      ? {fieldFilter:{field:{fieldPath:"datePT"},op:"EQUAL",value:{stringValue:dates[0]}}}
      : {fieldFilter:{field:{fieldPath:"datePT"},op:"IN",value:{arrayValue:{values:dates.map(x=>({stringValue:x}))}}}}
  }};
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),cache:"no-store"});
  const raw=await res.text();
  if(!res.ok)throw new Error(`Shared read HTTP ${res.status}: ${raw.slice(0,300)}`);
  const rows=raw?JSON.parse(raw):[];
  const docs=(Array.isArray(rows)?rows:[]).filter(x=>x&&x.document).map(x=>decodeDoc(x.document));
  const sentinelReadCount=Math.max(1,docs.length);
  readsThisSession+=sentinelReadCount;
  remoteDocs=docs;
  lastRemoteError="";
  try{await recordSentinelSharedActivity(sentinelReadCount);}catch(e){console.error("SENTINEL activity telemetry:",e);}
  return remoteDocs;
}
function docsForApp(id){return remoteDocs.filter(d=>d.appId===id)}
function telemetryFieldsForDoc(d){
  const out=[];
  Object.keys(d).forEach(k=>{
    const m=/^(r1|w1|d1|r|w|d)_(\d{4})$/.exec(k);
    if(!m)return;
    out.push({kind:m[1],bucket:m[2],value:+d[k]||0});
  });
  return out;
}
function metricKind(kind){
  if(kind==="r"||kind==="r1")return "reads";
  if(kind==="w"||kind==="w1")return "writes";
  return "deletes";
}
function inSelectedRange(ts,range){
  const now=Date.now();
  if(range==="hour")return ts>=now-60*60*1000 && ts<=now+60000;
  if(range==="day24")return ts>=now-24*60*60*1000 && ts<=now+60000;
  if(range==="week" || range==="month"){
    const allowed=new Set();
    const count=range==="month"?30:7;
    for(let i=0;i<count;i++)allowed.add(jstDateKey(now-i*86400000));
    return allowed.has(jstDateKey(ts));
  }
  return true;
}
function sumApp(id,range){
  const now=Date.now(),today=ptDateKey(now),docs=docsForApp(id),out={reads:0,writes:0,deletes:0};
  docs.forEach(d=>{
    if(range==="quotaDayPT"){
      if(d.datePT===today){
        out.reads+=+d.reads||0; out.writes+=+d.writes||0; out.deletes+=+d.deletes||0;
      }
      return;
    }
    telemetryFieldsForDoc(d).forEach(f=>{
      const ts=ptBucketToDate(d.datePT,f.bucket).getTime();
      if(!inSelectedRange(ts,range))return;
      out[metricKind(f.kind)]+=f.value;
    });
  });
  return out;
}
function ptBucketToDate(datePT,bucket){
  const [y,m,d]=datePT.split("-").map(Number);
  const hh=Number(bucket.slice(0,2));
  const mm=Number(bucket.slice(2));

  // まず仮のUTC日時を作る
  let utc=Date.UTC(y,m-1,d,hh,mm);

  // その瞬間のLos Angelesでの表示日時を取得
  const fmt=new Intl.DateTimeFormat("en-US",{
    timeZone:"America/Los_Angeles",
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hourCycle:"h23"
  });

  // PT表示と目的のPT日時との差を使ってUTCを補正
  for(let i=0;i<2;i++){
    const p=Object.fromEntries(
      fmt.formatToParts(new Date(utc))
        .filter(x=>x.type!=="literal")
        .map(x=>[x.type,x.value])
    );

    const shown=Date.UTC(
      +p.year,+p.month-1,+p.day,+p.hour,+p.minute
    );

    const wanted=Date.UTC(y,m-1,d,hh,mm);
    utc+=wanted-shown;
  }

  return new Date(utc);
}

function minuteFloor(ts){return Math.floor(ts/60000)*60000}
function rawPointMap(id){
  const map=new Map();
  docsForApp(id).forEach(d=>{
    telemetryFieldsForDoc(d).forEach(f=>{
      const ts=minuteFloor(ptBucketToDate(d.datePT,f.bucket).getTime());
      const p=map.get(ts)||{ts,reads:0,writes:0,deletes:0};
      p[metricKind(f.kind)]+=f.value;
      map.set(ts,p);
    });
  });
  return map;
}
function jstDateKey(ts){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(ts));
  const g=t=>p.find(x=>x.type===t)?.value||"";
  return `${g("year")}-${g("month")}-${g("day")}`;
}
function seriesForApp(id,range){
  const map=rawPointMap(id),now=Date.now(),pts=[];
  if(range==="week" || range==="month"){
    const days=[];
    const count=range==="month"?30:7;
    for(let i=count-1;i>=0;i--){
      const t=now-i*86400000,key=jstDateKey(t);
      if(!days.some(x=>x.key===key))days.push({key,ts:t,reads:0,writes:0,deletes:0});
    }
    const byDay=new Map(days.map(x=>[x.key,x]));
    map.forEach(p=>{
      const d=byDay.get(jstDateKey(p.ts));
      if(d){d.reads+=p.reads;d.writes+=p.writes;d.deletes+=p.deletes}
    });
    return days;
  }

  const endMinute=minuteFloor(now);

  if(range==="hour"){
    const startTs=endMinute-59*60000;
    for(let ts=startTs;ts<=endMinute;ts+=60000){
      const p=map.get(ts);
      pts.push(p||{ts,reads:0,writes:0,deletes:0});
    }
    return pts;
  }

  // 24h / PT当日：Shared Firestoreには1分粒度のまま保存し、
  // ダッシュボード描画時だけJSTの1時間単位へ合算する。
  let startTs;
  if(range==="day24"){
    startTs=endMinute-24*60*60000+60000;
  }else{
    const today=ptDateKey(now);
    startTs=minuteFloor(ptBucketToDate(today,"0000").getTime());
  }

  const hourMap=new Map();
  map.forEach(p=>{
    if(p.ts<startTs || p.ts>endMinute)return;
    const d=new Date(p.ts);
    const parts=new Intl.DateTimeFormat("en-US",{
      timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",hourCycle:"h23"
    }).formatToParts(d);
    const g=t=>parts.find(x=>x.type===t)?.value||"";
    const key=`${g("year")}-${g("month")}-${g("day")} ${g("hour")}`;
    let h=hourMap.get(key);
    if(!h){
      // JSTはUTC+9固定。ラベル位置用にそのJST時刻をUTCへ戻す。
      const ts=Date.UTC(+g("year"),+g("month")-1,+g("day"),+g("hour")-9,0);
      h={key,ts,reads:0,writes:0,deletes:0};
      hourMap.set(key,h);
    }
    h.reads+=p.reads; h.writes+=p.writes; h.deletes+=p.deletes;
  });

  const startHour=Math.floor(startTs/3600000)*3600000;
  const endHour=Math.floor(endMinute/3600000)*3600000;
  for(let ts=startHour;ts<=endHour;ts+=3600000){
    const parts=new Intl.DateTimeFormat("en-US",{
      timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",hourCycle:"h23"
    }).formatToParts(new Date(ts));
    const g=t=>parts.find(x=>x.type===t)?.value||"";
    const key=`${g("year")}-${g("month")}-${g("day")} ${g("hour")}`;
    pts.push(hourMap.get(key)||{key,ts,reads:0,writes:0,deletes:0});
  }
  return pts;
}
function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function pct(n,lim){return Math.min(999,(n/lim)*100)}
function severity(p){return p>=95?"danger":p>=80?"warn":""}
function latestSeen(id){

}

}

  const mobileAxis=chartIsMobile_();
  const L=46,R=34,T=10,B=mobileAxis?46:30,pw=Math.max(1,w-L-R),ph=Math.max(1,h-T-B);
  if(!pts.length){ctx.fillStyle="#72838d";ctx.font="11px sans-serif";ctx.fillText("No shared telemetry",L+10,T+ph/2);return}

  const rawMax=Math.max(1,...pts.flatMap(p=>[p.reads,p.writes,p.deletes]));
  const pow=Math.pow(10,Math.floor(Math.log10(rawMax))),n=rawMax/pow;
  const nice=(n<=1?1:n<=2?2:n<=5?5:10)*pow,ymax=Math.max(4,nice);

  ctx.font=(chartIsMobile_()?"9px sans-serif":"10px sans-serif");ctx.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const val=Math.round(ymax*(4-i)/4),y=T+ph*i/4;
    ctx.strokeStyle=i===4?"#52636d":"#263741";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+pw,y);ctx.stroke();
    ctx.fillStyle="#71838d";ctx.textAlign="right";ctx.fillText(val.toLocaleString("ja-JP"),L-6,y);
  }
  ctx.strokeStyle="#52636d";ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+ph);ctx.lineTo(L+pw,T+ph);ctx.stroke();

  const tickIdx=[];

if(selectedRange==="week"){
  const step=chartTickStep_("week",pts.length);
  for(let i=0;i<pts.length;i++) if(i%step===0 || i===pts.length-1) tickIdx.push(i);

}else if(selectedRange==="month"){
  const step=chartTickStep_("month",pts.length);
  for(let i=0;i<pts.length;i++) if(i%step===0 || i===pts.length-1) tickIdx.push(i);

}else{
  pts.forEach((p,i)=>{
    const parts=new Intl.DateTimeFormat("en-US",{
      timeZone:"Asia/Tokyo",
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }).formatToParts(new Date(p.ts));

    const hh=Number(parts.find(x=>x.type==="hour")?.value||0);
    const mm=Number(parts.find(x=>x.type==="minute")?.value||0);

    if(selectedRange==="hour"){
      const step=chartTickStep_("hour",pts.length);
      if(mm%step===0) tickIdx.push(i);

    }else if(selectedRange==="day24"){
      const step=chartTickStep_("day24",pts.length);
      if(mm===0 && hh%step===0) tickIdx.push(i);

    }else if(selectedRange==="quotaDayPT"){
      const step=chartTickStep_("quotaDayPT",pts.length);
      if(mm===0 && hh%step===0) tickIdx.push(i);
    }
  });

  if(!tickIdx.length) tickIdx.push(pts.length-1);
}

  ctx.fillStyle="#71838d";
  const mobileLabels=chartIsMobile_();
  const uniqueTicks=[...new Set(tickIdx)];
  uniqueTicks.forEach((idx,j,arr)=>{
    const p=pts[idx],x=pts.length===1?L+pw/2:L+idx/(pts.length-1)*pw;
    let label;
    if(selectedRange==="week" || selectedRange==="month"){
      const [y,m,d]=p.key.split("-");
      label=`${+m}/${+d}`;
    }else{
      label=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(p.ts));
    }

    if(mobileLabels){
      ctx.save();
      ctx.translate(x,T+ph+9);
      ctx.rotate(-Math.PI/4);
      ctx.textAlign="right";
      ctx.textBaseline="top";
      ctx.fillText(label,0,0);
      ctx.restore();
    }else{
      ctx.textBaseline="top";
      ctx.textAlign=j===0?"left":j===arr.length-1?"right":"center";
      const tx=j===0?Math.max(L,x):j===arr.length-1?Math.min(L+pw,x):x;
      ctx.fillText(label,tx,T+ph+7);
    }
  });

  const c=getComputedStyle(document.documentElement);
  const series=[
    ["reads",c.getPropertyValue("--chart-read").trim()],
    ["writes",c.getPropertyValue("--chart-write").trim()],
    ["deletes",c.getPropertyValue("--chart-delete").trim()]
  ];

  // v1.0: 全レンジを折れ線で統一。
  // 1h=1分、24h/PT当日=1時間、1week=1日。
  series.forEach(([key,color])=>{
    ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2;ctx.beginPath();
    pts.forEach((p,i)=>{
      const x=pts.length===1?L+pw/2:L+i/(pts.length-1)*pw;
      const y=T+ph-(p[key]/ymax)*ph;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.stroke();

    // 全レンジで各点を可視化。1時間表示は点数が多いので少し小さめ。
    const pointRadius=selectedRange==="hour"?1.4:2;
    pts.forEach((p,i)=>{
      if(!p[key])return;
      const x=pts.length===1?L+pw/2:L+i/(pts.length-1)*pw;
      const y=T+ph-(p[key]/ymax)*ph;
      ctx.beginPath();ctx.arc(x,y,pointRadius,0,Math.PI*2);ctx.fill();
    });
  });

}

function decodeDiagDoc(doc){const f=(doc&&doc.fields)||{},o={};Object.keys(f).forEach(k=>{const v=f[k];if("stringValue" in v)o[k]=v.stringValue;else if("integerValue" in v)o[k]=Number(v.integerValue);else if("booleanValue" in v)o[k]=!!v.booleanValue;else if("timestampValue" in v)o[k]=v.timestampValue});o._name=doc&&doc.name||"";return o}
async function fetchDiagnostics(){
  const headers=await sharedHeaders();
  const url=`https://firestore.googleapis.com/v1/projects/${SHARED_CONFIG.projectId}/databases/(default)/documents:runQuery`;
  const body={structuredQuery:{from:[{collectionId:DIAG_COLLECTION}],orderBy:[{field:{fieldPath:"occurredAt"},direction:"DESCENDING"}],limit:DIAG_LIMIT}};
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),cache:"no-store"});const raw=await res.text();
  if(!res.ok)throw new Error(`Diagnostic read HTTP ${res.status}: ${raw.slice(0,200)}`);
  const rows=raw?JSON.parse(raw):[];diagnosticRows=(Array.isArray(rows)?rows:[]).filter(x=>x&&x.document).map(x=>decodeDiagDoc(x.document));
  diagnosticError="";
  // This diagnostic query is also SENTINEL-caused Firestore activity.
  try{await recordSentinelSharedActivity(Math.max(1,diagnosticRows.length))}catch(e){console.error("SENTINEL diagnostic telemetry:",e)}
  return diagnosticRows;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function setDiagnosticConfirmed(row,checked,checkbox){
  if(!row||!row._name)return;
  if(checkbox)checkbox.disabled=true;
  try{
    const headers=await sharedHeaders();
    const url=`https://firestore.googleapis.com/v1/${row._name}?updateMask.fieldPaths=checked`;
    const body={fields:{checked:{booleanValue:!!checked}}};
    const res=await fetch(url,{method:"PATCH",headers,body:JSON.stringify(body),cache:"no-store"});
    const raw=await res.text();
    if(!res.ok)throw new Error(`Diagnostic checked HTTP ${res.status}: ${raw.slice(0,300)}`);
    row.checked=!!checked;
    renderDiagnostics();
  }catch(e){
    if(checkbox){checkbox.checked=!checked;checkbox.disabled=false;}
    alert("確認状態を保存できませんでした。\n"+(e.message||String(e)));
  }
}
async function deleteDiagnostic(row,button){
  if(!row||!row._name)return;
  if(!confirm("このエラーログをFirestoreから削除しますか？\nこの操作は元に戻せません。"))return;
  if(button)button.disabled=true;
  try{
    const headers=await sharedHeaders();
    const url=`https://firestore.googleapis.com/v1/${row._name}`;
    const res=await fetch(url,{method:"DELETE",headers,cache:"no-store"});
    const raw=await res.text();
    if(!res.ok)throw new Error(`Diagnostic delete HTTP ${res.status}: ${raw.slice(0,300)}`);
    const idx=diagnosticRows.indexOf(row);
    if(idx>=0)diagnosticRows.splice(idx,1);
    const appId=row.appId||"";
    const appCount=diagnosticRows.filter(r=>r.appId===appId).length;
    const pageCount=Math.max(1,Math.ceil(appCount/DIAG_PAGE_SIZE));
    diagnosticPages[appId]=Math.min(diagnosticPages[appId]||1,pageCount);
    renderDiagnostics();
  }catch(e){
    if(button)button.disabled=false;
    alert("エラーログを削除できませんでした。\n"+(e.message||String(e)));
  }
}

async function collectPushDiagnostics_(tryRegister=false){
  try{
    await waitForFirebase();
    if(tryRegister && "serviceWorker" in navigator){
      await navigator.serviceWorker.register("./firebase-messaging-sw.js",{scope:"./"});
      await navigator.serviceWorker.ready;
    }
    return true;
  }catch(e){
    console.warn("Push check:",e);
    return false;
  }
}


function subscriberDocId_(token){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(token)).then(buf=>
    [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")
  );
}

async function savePushSubscriber_(token){
  const headers=await sharedHeaders();
  const docId=await subscriberDocId_(token);
  const url=`https://firestore.googleapis.com/v1/projects/${SHARED_CONFIG.projectId}/databases/(default)/documents/${PUSH_SUBSCRIBER_COLLECTION}/${docId}`;
  const nowIso=new Date().toISOString();
  const body={fields:{
    token:{stringValue:token},
    createdAt:{timestampValue:nowIso},
    updatedAt:{timestampValue:nowIso},
    enabled:{booleanValue:true}
  }};
  const res=await fetch(url,{method:"PATCH",headers,body:JSON.stringify(body),cache:"no-store"});
  const raw=await res.text();
  if(!res.ok)throw new Error(`Push subscriber save HTTP ${res.status}: ${raw.slice(0,300)}`);
}

async function enablePushNotifications(){
  const btn=document.getElementById("notifyBtn");
  try{
    setNotifyUi_("設定中…",false,true);

    await waitForFirebase();
    await initShared();

    if(!("serviceWorker" in navigator))throw new Error("Service Worker非対応");
    if(!("Notification" in window))throw new Error("Notification API非対応");
    if(!("PushManager" in window))throw new Error("Push API非対応");
    if(typeof firebase.messaging!=="function")throw new Error("Firebase Messaging SDK未読込");

    if(/iPad|iPhone|iPod/.test(navigator.userAgent) && !isStandalonePwa()){
      throw new Error("iPhone/iPadではSENTINELをホーム画面に追加し、そのアイコンから開いてください");
    }
    if(!FCM_VAPID_PUBLIC_KEY || FCM_VAPID_PUBLIC_KEY.startsWith("PASTE_")){
      throw new Error("FCM_VAPID_PUBLIC_KEY が未設定です");
    }

    const permission=await Notification.requestPermission();
    if(permission!=="granted")throw new Error("通知が許可されませんでした");

    const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js",{scope:"./"});
    await navigator.serviceWorker.ready;

    sharedMessaging=sharedApp.messaging();
    const token=await sharedMessaging.getToken({
      vapidKey:FCM_VAPID_PUBLIC_KEY,
      serviceWorkerRegistration:reg
    });
    if(!token)throw new Error("FCMトークンを取得できませんでした");

    await savePushSubscriber_(token);
    localStorage.setItem("sentinelPushEnabled","1");
    localStorage.setItem("sentinelPushToken",token);
    setNotifyUi_("この端末はPush受信登録済み",true,false);
    await collectPushDiagnostics_(false);
  }catch(e){
    console.error("SENTINEL Push setup:",e);
    setNotifyUi_("設定失敗",false,false);
    await collectPushDiagnostics_(false).catch(()=>{});
    alert("Push通知を有効化できませんでした。\n"+(e.message||String(e)));
  }finally{
    if(btn)btn.disabled=false;
  }
}


async function disablePushNotifications(){
  const btn=document.getElementById("notifyBtn");
  try{
    setNotifyUi_("解除中…",true,true);

    await waitForFirebase();
    await initShared();

    let token=localStorage.getItem("sentinelPushToken")||"";

    // 旧版でtokenをlocalStorageに保存していない端末でも現在tokenを再取得して解除できるようにする。
    if(!token && "serviceWorker" in navigator && typeof firebase.messaging==="function"){
      const reg=await navigator.serviceWorker.getRegistration("./");
      if(reg){
        sharedMessaging=sharedApp.messaging();
        try{
          token=await sharedMessaging.getToken({
            vapidKey:FCM_VAPID_PUBLIC_KEY,
            serviceWorkerRegistration:reg
          })||"";
        }catch(_){}
      }
    }

    if(token){
      const headers=await sharedHeaders();
      const docId=await subscriberDocId_(token);
      const url=`https://firestore.googleapis.com/v1/projects/${SHARED_CONFIG.projectId}/databases/(default)/documents/${PUSH_SUBSCRIBER_COLLECTION}/${docId}?updateMask.fieldPaths=enabled&updateMask.fieldPaths=updatedAt`;
      const body={fields:{
        enabled:{booleanValue:false},
        updatedAt:{timestampValue:new Date().toISOString()}
      }};
      const res=await fetch(url,{method:"PATCH",headers,body:JSON.stringify(body),cache:"no-store"});
      const raw=await res.text();
      if(!res.ok)throw new Error(`Push subscriber disable HTTP ${res.status}: ${raw.slice(0,300)}`);

      // FCM側の購読も解除。失敗してもFirestore側でenabled=falseなら通知対象外になる。
      try{
        sharedMessaging=sharedMessaging||sharedApp.messaging();
        await sharedMessaging.deleteToken(token);
      }catch(e){
        console.warn("FCM token delete skipped:",e);
      }
    }

    localStorage.removeItem("sentinelPushEnabled");
    localStorage.removeItem("sentinelPushToken");
    setNotifyUi_("この端末のPush通知は解除済み",false,false);
    await collectPushDiagnostics_(false);
  }catch(e){
    console.error("SENTINEL Push disable:",e);
    setNotifyUi_("解除失敗",true,false);
    alert("Push通知を解除できませんでした。\\n"+(e.message||String(e)));
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function togglePushNotifications(){
  const enabled=localStorage.getItem("sentinelPushEnabled")==="1";
  if(enabled) return disablePushNotifications();
  return enablePushNotifications();
}

async function initPushUi(){
  const b=document.getElementById("notifyBtn");
  if(b)b.addEventListener("click",togglePushNotifications);

  try{await waitForFirebase();}catch(_){}

  if(!pushSupported()){
    setNotifyUi_("Push非対応",false,false);
    return;
  }
  if(Notification.permission==="denied"){
    setNotifyUi_("通知拒否",false,false);
    return;
  }
  if(Notification.permission==="granted" && localStorage.getItem("sentinelPushEnabled")==="1"){
    setNotifyUi_("登録済み",true,false);
  }else{
    setNotifyUi_("未設定",false,false);
  }
}


function render(){
  document.getElementById("prodGrid").innerHTML=APPS.filter(a=>a.group==="prod").map(cardHtml).join("");
  document.getElementById("devGrid").innerHTML=APPS.filter(a=>a.group==="dev").map(cardHtml).join("");
  const ptKey=ptDateKey(Date.now());
  const [,ptM,ptD]=ptKey.split("-");
  document.getElementById("ptDate").textContent=`PT ${Number(ptM)}/${Number(ptD)}`;
  const badge=document.getElementById("liveBadge");
  if(lastRemoteError){
    badge.textContent="エラー";
    badge.classList.remove("ok");
  }else{
    badge.textContent="接続済み";
    badge.classList.add("ok");
  }
  document.querySelectorAll(".card[data-app]").forEach(c=>{const cv=c.querySelector("canvas");if(cv)drawChart(cv,c.dataset.app)});
}
async function refresh(){
  const btns=[...document.querySelectorAll(".refreshBtn")];
  const badge=document.getElementById("liveBadge");
  btns.forEach(btn=>{btn.disabled=true;btn.textContent="…";});
  if(badge){
    badge.textContent="読込中";
    badge.classList.remove("ok");
  }
  try{
    await fetchShared();
    lastRemoteError="";
  }catch(e){
    lastRemoteError=e.message||String(e);
    console.error(e);
  }
  render();
  btns.forEach(btn=>{btn.disabled=false;btn.textContent="↻";});
}
document.querySelectorAll(".rangeSeg").forEach(seg=>seg.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-range]");if(!b)return;
  selectedRange=b.dataset.range;
  document.querySelectorAll(".rangeSeg button[data-range]").forEach(x=>x.classList.toggle("active",x.dataset.range===selectedRange));
  await refresh();
}));
document.querySelectorAll(".refreshBtn").forEach(btn=>btn.addEventListener("click",refresh));
window.addEventListener("resize",()=>setTimeout(render,60));

document.getElementById("navMonitor").addEventListener("click",()=>setSentinelView("monitor"));
document.getElementById("navDiagnostics").addEventListener("click",()=>setSentinelView("diagnostics"));
document.getElementById("diagRefreshBtn").addEventListener("click",refreshDiagnostics);

// Keep the intentional white splash briefly visible, then fade to the dark dashboard.
// This does not try to suppress iOS' native white launch frame; it visually connects to it.
window.addEventListener("load",()=>{
  const splash=document.getElementById("sentinelSplash");
  const MIN_SPLASH_MS=850;
  setTimeout(()=>{
    splash?.classList.add("depart");
    document.body.classList.remove("sentinel-booting");
    setTimeout(()=>splash?.remove(),1050);
  },MIN_SPLASH_MS);
},{once:true});

window.addEventListener("load",()=>{ initPushUi().catch(e=>console.error("Push UI init:",e)); },{once:true});
refresh();
setInterval(refresh,AUTO_REFRESH_MS);
</script>

</body>
</html>
